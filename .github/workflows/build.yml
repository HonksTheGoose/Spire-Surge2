name: Build mod jar

# Builds the addon on GitHub's servers, so you don't need Java installed.
# Runs automatically on every push, or manually from the Actions tab ("Run workflow").
# The finished jar is under the run's "Artifacts" section.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Uses its own Gradle, so it works even if the wrapper files were lost during upload.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: spire-surge-jar
          path: build/libs/*.jar
          if-no-files-found: error
