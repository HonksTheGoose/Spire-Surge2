plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.72'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Dev-only: drop mobtowers-1.0.6.jar into the /libs folder and `gradlew runClient`
    // will launch Minecraft with Spawn Spires + this addon together.
    // This addon has NO compile-time dependency on Spawn Spires, so the build works without it.
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
